apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secret
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/shaarron/feature-flags-resources.git
    targetRevision: main
    path: infrastructure/external-secret
    helm:
      valueFiles:
      - ../../argocd/environments/values.yaml
      - ../../argocd/environments/prod/values.yaml


  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
