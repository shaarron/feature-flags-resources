{{- if .Values.mongo.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "mongodb.fullname" . }}-external-secret
  labels:
    {{- include "mongodb.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secret-store
    kind: ClusterSecretStore
  target:
    name: {{ .Values.mongo.secretName | default "mongo-secret" }}
    creationPolicy: Owner
  data:
    - secretKey: MONGO_INITDB_ROOT_PASSWORD
      remoteRef:
        key: feature-flags/{{ .Values.env }}
        property: MONGO_INITDB_ROOT_PASSWORD

    - secretKey: APP_USER_PASSWORD
      remoteRef:
        key: feature-flags/{{ .Values.env }}
        property: APP_USER_PASSWORD
{{- end }}
