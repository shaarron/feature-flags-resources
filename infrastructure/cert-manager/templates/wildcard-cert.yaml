apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "cert-manager.fullname" . }}-wildcard-cert
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cert-manager.labels" . | nindent 4 }}
spec:
  secretName: {{ .Values.certManagerConfig.wildcardCert.secretName }}
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  commonName: "*.{{ .Values.global.domain }}"
  dnsNames:
    - "*.{{ .Values.global.domain }}"
    - "{{ .Values.global.domain }}"
    - "*.dev.{{ .Values.global.domain }}"
