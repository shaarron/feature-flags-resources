apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "efk.fullname" . }}-kibana-ingress
  namespace: {{ .Values.namespace | default "efk" }}
  labels:
    {{- include "efk.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    cert-manager.io/cluster-issuer: "letsencrypt-production"
    acme.cert-manager.io/http01-edit-in-place: "true"
    external-dns.alpha.kubernetes.io/hostname: "kibana.{{ .Values.global.host }}"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - kibana.{{ .Values.global.host }}
      secretName: {{ .Values.ingress.tlsSecretName }}
  rules:
    - host: kibana.{{ .Values.global.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kibana-kb-http
                port:
                  number: 5601
