apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kube-prometheus-stack.fullname" . }}-nginx-ingress-grafana-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-prometheus-stack.labels" . | nindent 4 }}
    grafana_dashboard: "1"
    app.kubernetes.io/name: ingress-nginx
# based on the official ingress nginx controller dashboard id: 9614
data:
  nginx-ingress.json: |-
{{ .Files.Get "dashboards/nginx-ingress.json" | indent 4 }}