{{- $kps := index .Values "kube-prometheus-stack" -}}
{{- if $kps.grafana.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "kube-prometheus-stack.fullname" . }}-grafana-external-secret
  namespace: kps
  labels:
    {{- include "kube-prometheus-stack.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secret-store
    kind: ClusterSecretStore
  target:
    name: {{ $kps.grafana.admin.existingSecret | default "grafana-secret" }}
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: feature-flags/{{ .Values.env }}
        property: admin-user

    - secretKey: admin-password
      remoteRef:
        key: feature-flags/{{ .Values.env }}
        property: admin-password
{{- end }}
