apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kube-prometheus-stack.fullname" . }}-feature-flags-api-grafana-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-prometheus-stack.labels" . | nindent 4 }}
    grafana_dashboard: "1"
    app.kubernetes.io/name: feature-flags-api
data:
  feature-flags-api-monitor.json: |
{{ .Files.Get "dashboards/feature-flags.json" | indent 4 }}