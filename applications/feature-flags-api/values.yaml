nameOverride: feature-flags-api

global:
  host: "example.com"
  
replicaCount: 2

image:
  repository: ghcr.io/shaarron/feature-flags-app/feature-flags-api
  tag: v1.0.0
  pullPolicy: IfNotPresent

initContainers:
  mongoWait:
    name: wait-for-mongo
    image: busybox
    sleep: 3

podSecurityContext:
  fsGroup: 1001

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001

service:
  type: ClusterIP
  port: 5000

mongo:
  secretName: mongo-secret  
  configMapName: mongo-config   
  rootUsername: root1
  host: mongo-svc.default.svc.cluster.local
  port: 27017
  isReplicaSet: true

readinessProbe:
  path: /flags
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3
  successThreshold: 1

livenessProbe:
  path: /flags
  initialDelaySeconds: 15
  periodSeconds: 2
  timeoutSeconds: 2
  failureThreshold: 3

resources:
  requests:
    memory: "128Mi"
    cpu: "50m"
  limits:
    memory: "256Mi"
    cpu: "100m"

