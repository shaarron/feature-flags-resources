apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "feature-flags-api.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "feature-flags-api.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://feature-flags.{{ .Values.global.host }}"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, PATCH, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - {{ .Values.ingress.subdomain }}.{{ .Values.global.host }}
      secretName: {{ .Values.ingress.tlsSecretName }}
  rules:
    - host: {{ .Values.ingress.subdomain }}.{{ .Values.global.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "feature-flags-api.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
