apiVersion: v1
kind: Service
metadata:
  name: {{ include "feature-flags-api.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "feature-flags-api.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type | default "ClusterIP" }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      protocol: TCP
      name: http
  selector:
    {{- include "feature-flags-api.selectorLabels" . | nindent 4 }}
