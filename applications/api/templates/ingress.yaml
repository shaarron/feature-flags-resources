apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "api.fullname" . }}
  labels:
    {{- include "api.labels" . | nindent 4 }}
  annotations:
    external-dns.alpha.kubernetes.io/hostname: "{{ if .Values.ingress.host }}{{ .Values.ingress.host }}.{{ .Values.global.domain }}{{ else }}{{ include "api.fullname" . }}.{{ .Values.global.host }}{{ end }}"
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- toYaml .Values.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ if .Values.ingress.host }}{{ .Values.ingress.host }}.{{ .Values.global.domain }}{{ else }}{{ include "api.fullname" . }}{{ if .Values.global.host }}.{{ .Values.global.host }}{{ end }}{{ end }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "api.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
